name: Test, Build and Publish Docker Image

on:
  pull_request:
    paths:
      - "app/**"
      - "helm-chart/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "app/**"

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r app/requirements.txt

      - name: Run unit tests
        run: PYTHONPATH=app python -m unittest discover -s app/tests -v

      - name: Compile Python sources
        run: python -m compileall -q app

  build-and-push:
    name: Build and publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_PASSWORD" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx create --name city-population-builder --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "ghcr.io/ahmedovelshan/city-population-app:$IMAGE_TAG" \
            --tag "ghcr.io/ahmedovelshan/city-population-app:latest" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            ./app

      - name: Update Helm chart image version
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          TAG="${IMAGE_TAG:0:7}"
          sed -i -E "s/^    tag: .*/    tag: \"$TAG\"/" helm-chart/values.yaml
          python - "$TAG" <<'PY'
          import pathlib
          import re
          import sys

          chart = pathlib.Path("helm-chart/Chart.yaml")
          content = chart.read_text()
          content, count = re.subn(
              r"(?m)^appVersion:.*$",
              f'appVersion: "{sys.argv[1]}"',
              content,
          )
          if count != 1:
              raise SystemExit("Expected exactly one appVersion entry in Chart.yaml")
          chart.write_text(content)
          PY

          git diff --check
          if git diff --quiet; then
            echo "Helm chart already references this image."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm-chart/values.yaml helm-chart/Chart.yaml
          git commit -m "chore: update app image to $TAG [skip ci]"
          git push origin HEAD:main
