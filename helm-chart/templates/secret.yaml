apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.elasticsearch.secretName }}
  labels:
    app: {{ .Values.app.name }}
type: Opaque
data:
  url: {{ (printf "http://%s:%v" .Values.elasticsearch.name .Values.elasticsearch.port) | b64enc | quote }}
  username: {{ .Values.elasticsearch.username | b64enc | quote }}
  password: {{ required "Set elasticsearch.password with --set-file or an external secret before installing the chart" .Values.elasticsearch.password | b64enc | quote }}
